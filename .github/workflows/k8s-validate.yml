name: k8s-validate

on:
  push:
    paths:
      - 'infra/helm/**'
  pull_request:
    paths:
      - 'infra/helm/**'

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - uses: azure/setup-helm@v4

      - name: Validate manifests
        run: |
          helm template infra/helm/gaming-backend-platform \
            -f infra/helm/gaming-backend-platform/values-local.yaml \
            --set-file gateway.ocelotConfigJson=backend/ApiGateway/ocelot.Kubernetes.json \
            --namespace gaming-platform \
            | kubeconform -strict -summary -
