name: k8s-validate

on:
  push:
    paths:
      - 'infra/kubernetes/**'
  pull_request:
    paths:
      - 'infra/kubernetes/**'

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Validate manifests
        run: kubectl kustomize --load-restrictor=LoadRestrictionsNone infra/kubernetes/ | kubeconform -strict -summary -
