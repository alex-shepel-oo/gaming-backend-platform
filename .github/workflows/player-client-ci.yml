name: player-client-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Trivy filesystem scan
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: fs
          target: frontend
          category: trivy-fs

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/projects/player-client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/player-client:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/player-client:${{ github.ref_name }}

      - name: Trivy image scan
        if: github.event_name == 'push'
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: image
          target: ghcr.io/${{ github.repository_owner }}/player-client:${{ github.sha }}
          category: trivy-image

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/bump-image-tag
        with:
          yaml-paths: .deployments.player-client.imageTag
