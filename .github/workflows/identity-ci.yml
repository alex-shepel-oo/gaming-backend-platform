name: identity-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/IdentityService/**'
      - 'backend/IdentityService.Tests/**'
      - 'backend/Directory.*.props'
      - 'global.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/IdentityService/**'
      - 'backend/IdentityService.Tests/**'
      - 'backend/Directory.*.props'
      - 'global.json'

permissions:
  contents: write
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore backend/IdentityService.Tests/IdentityService.Tests.csproj

      - name: Build
        run: dotnet build backend/IdentityService.Tests/IdentityService.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/IdentityService.Tests/IdentityService.Tests.csproj --no-build --configuration Release

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/IdentityService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/identity-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/identity-service:${{ github.ref_name }}

      - name: Build and push migrator image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/IdentityService/Dockerfile
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/identity-migrator:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/identity-migrator:${{ github.ref_name }}

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # A stuck retry here shouldn't paint the whole workflow -- and this
        # badge -- red over an operational hiccup unrelated to whether the
        # code itself built and tested clean. GitHub still surfaces the
        # step's own ::error:: annotation on the run if it does fail.
        continue-on-error: true
        uses: ./.github/actions/bump-image-tag
        with:
          values-file: infra/helm/gaming-backend-platform/image-tags/identity.yaml
          yaml-paths: >-
            .deployments.identity-service.imageTag
            .migrationJobs.identity-migrator.imageTag
