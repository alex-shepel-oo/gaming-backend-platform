<mat-toolbar class="shell-toolbar">
  <span class="shell-brand">Gaming Backend Platform — Admin</span>

  @if (tokenStore.claims()?.permissions?.includes('platform.games.manage')) {
    <a mat-button routerLink="/games">Games</a>
  }

  @if (tokenStore.claims()?.permissions?.includes('platform.roles.manage')) {
    <a mat-button routerLink="/roles">Roles</a>
  }

  <span class="shell-spacer"></span>

  @if (tokenStore.claims(); as claims) {
    <span class="shell-identity" title="Signed in as">{{ claims.email }} · {{ claims.scope }}</span>
  }

  <button type="button" mat-button (click)="logout()">
    <mat-icon aria-hidden="true">logout</mat-icon>
    Log out
  </button>
</mat-toolbar>

<main class="shell-content">
  <router-outlet />
</main>
