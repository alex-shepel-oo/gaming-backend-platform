server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # style-src needs 'unsafe-inline': Angular Material injects its CSS as
    # runtime <style> tags. img-src stays wide open since game/currency icon
    # URLs point at arbitrary external hosts, with no fixed allowlist.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Same origin for statics and /api so gbp_admin_refresh's SameSite=Strict
    # survives a direct hit on :8081 (ADR-0016). No cookie rewriting here, so
    # Set-Cookie reaches the browser exactly as IdentityService wrote it.
    location /api/ {
        proxy_pass http://api-gateway:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No /hubs location here: admin-client has no SignalR/notification hub
    # usage, unlike player-client.

    # Same-origin proxy for Faro's OTLP/HTTP trace export, same idea as /api.
    location /otlp/ {
        proxy_pass http://otel-collector:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
