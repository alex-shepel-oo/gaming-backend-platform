server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # style-src allows 'unsafe-inline': Angular Material (and any component
    # with styleUrl) injects its CSS as runtime <style> tags, not an external
    # file -- there is no nonce/hash alternative without per-response nginx
    # templating. script-src stays without it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reverse-proxied, not left for a future k8s ingress to unify: the browser
    # needs a single origin for statics and /api so the gbp_refresh cookie's
    # SameSite=Strict survives a direct hit on :8080 (see ADR-0012). Cookie
    # attributes (Path/SameSite/Secure/HttpOnly) are not touched here -- no
    # proxy_cookie_path/proxy_cookie_domain -- so Set-Cookie reaches the
    # browser exactly as IdentityService wrote it.
    location /api/ {
        proxy_pass http://api-gateway:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
