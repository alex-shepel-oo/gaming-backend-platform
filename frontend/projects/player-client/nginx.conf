server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # style-src allows 'unsafe-inline': Angular Material (and any component
    # with styleUrl) injects its CSS as runtime <style> tags, not an external
    # file -- there is no nonce/hash alternative without per-response nginx
    # templating. script-src stays without it. connect-src additionally allows
    # otel-collector's OTLP/HTTP port directly (not proxied same-origin like
    # /api) -- Faro's tracing instrumentation posts spans straight there from
    # the browser, and 'self' alone silently blocks that fetch before it ever
    # leaves the page, no CORS error, just a CSP violation.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:4318; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reverse-proxied, not left for a future k8s ingress to unify: the browser
    # needs a single origin for statics and /api so the gbp_refresh cookie's
    # SameSite=Strict survives a direct hit on :8080 (see ADR-0012). Cookie
    # attributes (Path/SameSite/Secure/HttpOnly) are not touched here -- no
    # proxy_cookie_path/proxy_cookie_domain -- so Set-Cookie reaches the
    # browser exactly as IdentityService wrote it.
    location /api/ {
        proxy_pass http://api-gateway:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Not proxied through api-gateway above: Ocelot 24.1.0 accepts the
    # WebSocket upgrade request and returns 101, but never actually pumps
    # frames afterward -- confirmed by connecting directly to
    # notification-service (instant, working handshake and push) versus
    # through the gateway (upgrade response stalls ~15s then the connection
    # closes before any SignalR frame crosses it). Nginx proxies the hub
    # directly instead, the same direct-proxy shape already used for /api
    # in ADR-0012, just fronting a different upstream (see ADR-0014).
    location /hubs {
        proxy_pass http://notification-service:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
