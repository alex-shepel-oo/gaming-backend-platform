<mat-toolbar class="shell-toolbar">
  <span class="shell-brand">Gaming Backend Platform</span>

  <nav class="shell-nav" aria-label="Main navigation">
    <a mat-button routerLink="/games" routerLinkActive="shell-nav-link-active">Games</a>
    <a mat-button routerLink="/wallet" routerLinkActive="shell-nav-link-active">Wallet</a>
    <a mat-button routerLink="/convert" routerLinkActive="shell-nav-link-active">Convert</a>
  </nav>

  <span class="shell-spacer"></span>

  @if (gameSelection.selected(); as game) {
    <span class="shell-game" title="Selected game">{{ game.name }}</span>
  }

  <button type="button" mat-button (click)="logout()">
    <mat-icon aria-hidden="true">logout</mat-icon>
    Log out
  </button>
</mat-toolbar>

<main class="shell-content">
  <router-outlet />
</main>
