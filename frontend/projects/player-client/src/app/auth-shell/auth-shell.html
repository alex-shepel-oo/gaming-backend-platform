<div class="auth-page">
  <mat-card class="auth-card">
    @if (state() === 'auth') {
      <mat-tab-group
        animationDuration="0ms"
        [selectedIndex]="selectedTabIndex()"
        (selectedIndexChange)="selectedTabIndex.set($event)"
      >
        <mat-tab label="Log in">
          <div class="auth-tab-content">
            <app-login />
          </div>
        </mat-tab>
        <mat-tab label="Register">
          <div class="auth-tab-content">
            <app-register (registered)="onRegistered($event)" />
          </div>
        </mat-tab>
      </mat-tab-group>

      @if (notice(); as message) {
        <p class="auth-notice">{{ message }}</p>
      }
    } @else if (pendingRegistration(); as pending) {
      <div class="auth-tab-content">
        <app-confirm-email
          [email]="pending.email"
          [password]="pending.password"
          (confirmed)="onConfirmed()"
          (backToLogin)="onBackToLogin()"
        />
      </div>
    }
  </mat-card>
</div>
