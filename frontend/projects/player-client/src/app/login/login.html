<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="email" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" autocomplete="current-password" required />
  </mat-form-field>

  <a class="forgot-password-link" routerLink="/reset-password">Forgot password?</a>

  @if (error() === 'invalid-credentials') {
    <p class="auth-error" role="alert">Invalid email or password.</p>
  }

  @if (error() === 'email-not-confirmed') {
    <p class="auth-error" role="alert">Please confirm your email address before logging in.</p>
  }

  <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || submitting()">
    @if (submitting()) {
      <mat-spinner diameter="20" />
    } @else {
      Log in
    }
  </button>
</form>
