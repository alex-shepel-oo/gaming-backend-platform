<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="auth-field">
    <label class="auth-field__label" for="login-email">Email Address</label>
    <div class="auth-field__input-wrap">
      <mat-icon aria-hidden="true">mail</mat-icon>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="player@domain.com"
        required
      />
    </div>
  </div>

  <div class="auth-field">
    <div class="auth-field__label-row">
      <label class="auth-field__label" for="login-password">Password</label>
      <a class="auth-field__link" routerLink="/reset-password">Forgot password?</a>
    </div>
    <div class="auth-field__input-wrap">
      <mat-icon aria-hidden="true">lock</mat-icon>
      <input
        id="login-password"
        [type]="hidePassword() ? 'password' : 'text'"
        formControlName="password"
        autocomplete="current-password"
        placeholder="••••••••"
        required
      />
      <button
        type="button"
        class="auth-field__toggle"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
      >
        <mat-icon aria-hidden="true">{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>
  </div>

  @if (error() === 'invalid-credentials') {
    <p class="auth-error" role="alert">Invalid email or password.</p>
  }

  @if (error() === 'email-not-confirmed') {
    <p class="auth-error" role="alert">Please confirm your email address before logging in.</p>
  }

  <button type="submit" class="auth-submit" [disabled]="form.invalid || submitting()">
    @if (submitting()) {
      <mat-spinner diameter="20" />
    } @else {
      Log in
      <mat-icon aria-hidden="true">arrow_forward</mat-icon>
    }
  </button>
</form>
