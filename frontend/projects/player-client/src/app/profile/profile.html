<h1>Profile</h1>

@if (tokenStore.claims(); as claims) {
  <mat-card class="profile-card">
    <mat-card-content class="profile-identity">
      <app-avatar [name]="claims.displayName" style="--avatar-size: 72px" />
      <div>
        <h2 class="profile-name">{{ claims.displayName }}</h2>
        <p class="profile-role">{{ claims.role }}</p>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="profile-card">
    <mat-card-header>
      <mat-card-title>Account</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <dl class="profile-fields">
        <dt>Email</dt>
        <dd>{{ claims.email }}</dd>

        <dt>Member since</dt>
        <dd><app-not-available message="Join date isn't available yet" /></dd>
      </dl>
    </mat-card-content>
  </mat-card>
} @else {
  <p class="profile-error" role="alert">We couldn't read your account details. Try logging in again.</p>
}
