# Argo CD's own Application CR. See ADR 0023 for why this exists, the
# anonymous-access and admin-RBAC incidents behind syncPolicy.automated being
# safe to leave on, and how the image-tags/*.yaml split below ties into
# .github/actions/bump-image-tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gaming-backend-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alex-shepel-oo/gaming-backend-platform.git
    targetRevision: main
    path: infra/helm/gaming-backend-platform
    helm:
      valueFiles:
        # Per-service base spec (see ADR 0021): must come first, since
        # values-production/*.yaml below overrides specific fields (hpa,
        # ingress host) inside these same service blocks. Argo CD has no
        # glob support for valueFiles, unlike apply.sh's local equivalent,
        # so this list is enumerated by hand.
        - values/identity-service.yaml
        - values/economy-service.yaml
        - values/email-service.yaml
        - values/notification-service.yaml
        - values/platform-worker.yaml
        - values/player-client.yaml
        - values/admin-client.yaml
        - values/gateway.yaml
        - values/mailpit.yaml
        - values/otel-collector.yaml
        - values/tempo.yaml
        - values/prometheus.yaml
        - values/loki.yaml
        - values/grafana.yaml
        - values/identity-db.yaml
        - values/economy-db.yaml
        - values/rabbitmq.yaml
        - values/identity-migrator.yaml
        - values/economy-migrator.yaml
        - values-local.yaml
        - values-production.yaml
        # Per-service production overrides: env/hpa/ingress-host
        # differences from the base spec above. See ADR 0023.
        - values-production/identity-service.yaml
        - values-production/economy-service.yaml
        - values-production/gateway.yaml
        - values-production/notification-service.yaml
        - values-production/email-service.yaml
        - values-production/grafana.yaml
        - values-production/player-client.yaml
        - values-production/admin-client.yaml
        - values-production/prometheus.yaml
        - values-production/loki.yaml
        - values-production/tempo.yaml
        # CI-managed image tags, one file per workflow; see ADR 0023 and
        # image-tags/*.yaml's own comments for which workflow owns which.
        - image-tags/identity.yaml
        - image-tags/economy.yaml
        - image-tags/gateway.yaml
        - image-tags/notification.yaml
        - image-tags/email.yaml
        - image-tags/platform-worker.yaml
        - image-tags/player-client.yaml
        - image-tags/admin-client.yaml
      # --set-file's equivalent: a leading "/" is repo-root-relative rather
      # than chart-path-relative, since every one of these lives outside
      # infra/helm/gaming-backend-platform itself, the same files
      # scripts/k8s/apply.sh passes in for the local cluster.
      fileParameters:
        - name: gateway.ocelotConfigJson
          path: /backend/ApiGateway/ocelot.Kubernetes.json
        - name: observability.otelCollectorConfigYaml
          path: /infra/otel-collector/otel-collector-config.yaml
        - name: observability.tempoConfigYaml
          path: /infra/tempo/tempo-config.yaml
        - name: observability.prometheusConfigYaml
          path: /infra/prometheus/prometheus.yml
        - name: observability.lokiConfigYaml
          path: /infra/loki/loki-config.yaml
        - name: observability.grafanaDatasourcesYaml
          path: /infra/grafana/provisioning/datasources/datasources.yml
        - name: observability.grafanaDashboardsProviderYaml
          path: /infra/grafana/provisioning/dashboards/dashboards.yml
        - name: observability.grafanaDashboardJson
          path: /infra/grafana/dashboards/service-overview.json
        - name: observability.grafanaNodeResourcesDashboardJson
          path: /infra/grafana/dashboards/node-resources.json
        - name: emailService.templates.emailVerificationHtml
          path: /backend/EmailService/Templates/EmailVerification.html
        - name: emailService.templates.emailVerificationText
          path: /backend/EmailService/Templates/EmailVerification.txt
        - name: emailService.templates.passwordResetHtml
          path: /backend/EmailService/Templates/PasswordReset.html
        - name: emailService.templates.passwordResetText
          path: /backend/EmailService/Templates/PasswordReset.txt
        - name: emailService.templates.duplicateRegistrationNoticeHtml
          path: /backend/EmailService/Templates/DuplicateRegistrationNotice.html
        - name: emailService.templates.duplicateRegistrationNoticeText
          path: /backend/EmailService/Templates/DuplicateRegistrationNotice.txt
  destination:
    server: https://kubernetes.default.svc
    namespace: gaming-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
