# Real production target: shepel.dev, VPS behind Cloudflare (SSL/TLS: Full strict) --
# see .plan/vps_rollout_plan.md.
#
# TLS: Traefik presents a Cloudflare Origin Certificate, not a Let's Encrypt one --
# Cloudflare's own edge issues the public-facing cert, the origin only needs to be
# trusted by Cloudflare specifically. ingress.tlsSecretName below must exist as a
# Secret (the Origin Certificate's cert+key) in both gaming-platform and observability
# namespaces before this actually serves HTTPS -- not created by this chart itself.
#
image:
  tag: develop

mailpit:
  enabled: false

# The base chart's hpa.maxReplicas: 10 (per service) is sized for a real multi-node
# cluster, not this single small VPS -- proven live: identity-service hit all 10 replicas
# during a startup crash-loop, which then exhausted the node's inotify watch limit
# (each replica's FileSystemWatcher on appsettings.json needs one), turning a transient
# CPU spike into a much worse cascade of new crashes. 3 is enough headroom for real demo
# traffic on this box without repeating that.
deployments:
  # ASPNETCORE_ENVIRONMENT=Production (not the chart's own Development default) and
  # Seeding__Enabled=false: found live on the first real deploy that leaving these
  # unset meant DevelopmentSeeder's known DemoPassword123! accounts (including a
  # Platform Admin) actually existed on a publicly reachable server -- README's own
  # "this password only exists on a local/sandbox cluster" statement was being
  # violated by the default. Production also gets the refresh cookie's Secure flag
  # right, which only appsettings.json (not appsettings.Development.json) sets.
  identity-service:
    configMap:
      ASPNETCORE_ENVIRONMENT: "Production"
      Seeding__Enabled: "false"
    hpa:
      maxReplicas: 3
  economy-service:
    configMap:
      ASPNETCORE_ENVIRONMENT: "Production"
      Seeding__Enabled: "false"
    hpa:
      maxReplicas: 3
  gateway:
    hpa:
      maxReplicas: 3
  notification-service:
    configMap:
      ASPNETCORE_ENVIRONMENT: "Production"
  # Real Resend SMTP relay instead of mailpit. shepel.dev is verified with Resend now
  # (MX/SPF on send.shepel.dev, DKIM via resend._domainkey.shepel.dev), so Email__From
  # is a real address on it instead of the onboarding@resend.dev sandbox sender that
  # only ever delivers to the account owner's own inbox. Credentials themselves live in
  # secrets.enc/email-service.enc.yaml, not here.
  email-service:
    configMap:
      Email__Smtp__Host: "smtp.resend.com"
      Email__Smtp__Port: "587"
      Email__Smtp__UseStartTls: "true"
      Email__From: "no-reply@shepel.dev"
  # Recruiter-facing read access goes through Grafana's own Public Dashboards feature
  # instead (share a specific curated dashboard via its own unique URL, no login, no
  # Cloudflare Access seat) -- narrower than instance-wide anonymous access would have
  # been, and doesn't hit Cloudflare Access's 50-seat free-tier ceiling. Nothing to
  # configure here for that; it's a per-dashboard toggle in the UI as the real admin.

ingress:
  tlsSecretName: cloudflare-origin-tls
  hosts:
    player-client:
      host: gbplatform.shepel.dev
      service: player-client
      port: 8080
    admin-client:
      host: gbadmin.shepel.dev
      service: admin-client
      port: 8081
    gateway:
      host: gbgateway.shepel.dev
      service: api-gateway
      port: 5100
    grafana:
      host: gbgrafana.shepel.dev
      service: grafana
      port: 3000
      namespace: observability
    # Prometheus/Loki/Tempo stay off public ingress in production -- none of them have
    # auth of their own, and nothing needs to browse to them directly; Grafana already
    # queries all three as datasources over in-cluster Service DNS.
    prometheus: null
    loki: null
    tempo: null
