# Default/structural values: the shape every environment shares (ports,
# probes, resource requests, which services talk to which). Values that
# genuinely differ per target (image tag, whether mailpit exists, the ingress
# class/host) live in values-local.yaml / values-production.yaml and are
# passed with -f on top of this file, not duplicated here.
#
# The namespace is not templated by this chart -- install with
# `--namespace gaming-platform --create-namespace` and every object below
# lands there via .Release.Namespace.

image:
  registry: ghcr.io/alex-shepel-oo
  tag: latest
  pullPolicy: IfNotPresent

# Default terminationGracePeriodSeconds for every Deployment (templates/deployment.yaml
# reads $svc.terminationGracePeriodSeconds first, falling back to this), overridable per
# service if one genuinely needs longer than another later. 30s comfortably covers this
# platform's slowest realistic in-flight work: the Ocelot gateway's own QoSOptions.Timeout
# (backend/ApiGateway/ocelot.json) caps a single proxied call at 5s, and
# OutboxDispatcherService's worst-case Polly retry tail per message is ~3s
# (BuildingBlocks.Messaging/Outbox/OutboxDispatcherService.cs). Each backend service's
# HostOptions.ShutdownTimeout is set below this value, so the host always finishes and
# exits on its own before Kubernetes would otherwise send SIGKILL.
terminationGracePeriodSeconds: 30

ingress:
  enabled: true
  # Traefik, installed as a cluster addon (scripts/k8s/install-traefik.sh),
  # not something this chart itself deploys -- same relationship the old
  # Kustomize tree had with ingress-nginx, just pointed at a different
  # controller.
  className: traefik
  # One host-based rule per web-facing Service already in this chart --
  # every entry's `host` is a single-level `*.localhost` name, which every
  # major browser/OS resolves to 127.0.0.1 with zero configuration (RFC
  # 6761), unlike the old admin.gaming-platform.local rule that needed a
  # manual /etc/hosts entry. `mailpit` is skipped below (see ingress.yaml)
  # when mailpit.enabled is false. Entries that carry a `namespace` (the
  # observability ones below) render into a second Ingress object in that
  # namespace instead of this chart's default gaming-platform one -- an
  # Ingress rule's backend Service can only ever live in the Ingress's own
  # namespace, so otel-collector is deliberately absent here too (it's an
  # ingestion target other in-cluster workloads reach via Service DNS, not
  # something a human browses to).
  hosts:
    player-client:
      host: player-client.localhost
      service: player-client
      port: 8080
    admin-client:
      host: admin-client.localhost
      service: admin-client
      port: 8081
    mailpit:
      host: mailpit.localhost
      service: mailpit
      port: 8025
    gateway:
      host: gateway.localhost
      service: api-gateway
      port: 5100
    grafana:
      host: grafana.localhost
      service: grafana
      port: 3000
      namespace: observability
    prometheus:
      host: prometheus.localhost
      service: prometheus
      port: 9090
      namespace: observability
    loki:
      host: loki.localhost
      service: loki
      port: 3100
      namespace: observability
    tempo:
      host: tempo.localhost
      service: tempo
      port: 3200
      namespace: observability

mailpit:
  enabled: true

sharedConfig:
  Jwt__Issuer: "gaming-backend-platform/identity"
  Jwt__Audiences__0: "gbp-player"
  Jwt__Audiences__1: "gbp-admin"
  Jwt__ClockSkewSeconds: "30"

# ocelot.Kubernetes.json lives under backend/ApiGateway/, outside this chart,
# so it stays the one copy of the gateway's routing table instead of a second
# one drifting inside the chart. apply.sh supplies it at deploy time with
# `--set-file gateway.ocelotConfigJson=backend/ApiGateway/ocelot.Kubernetes.json`;
# left empty here so `helm lint`/`helm template` still render without it.
gateway:
  ocelotConfigJson: ""

# otel-collector/Tempo/Prometheus/Loki/Grafana live in their own namespace,
# separate from gaming-platform -- per the owner's own principle of not
# duplicating this stack per environment later, keeping it structurally
# separate now (one shared observability namespace, multiple app namespaces)
# is the natural shape rather than something to retrofit once a staging/
# production split exists. Namespace creation itself is external to this
# chart, the same way gaming-platform's is (scripts/k8s/up.sh), not a
# resource this chart declares -- avoids Helm's "invalid ownership metadata"
# conflict a chart-declared Namespace would hit once something else has
# already created it.
#
# Each *Yaml/*Json value below is this component's config file, straight
# from its docker-compose counterpart (infra/otel-collector/, infra/tempo/,
# infra/loki/, infra/prometheus/, infra/grafana/) -- same reasoning as
# gateway.ocelotConfigJson above, supplied at deploy time with --set-file so
# there is exactly one copy of each, not a second one drifting inside the
# chart. Left empty here so `helm lint`/`helm template` still render without
# them.
observability:
  namespace: observability
  otelCollectorConfigYaml: ""
  tempoConfigYaml: ""
  prometheusConfigYaml: ""
  lokiConfigYaml: ""
  grafanaDatasourcesYaml: ""
  grafanaDashboardsProviderYaml: ""
  grafanaDashboardJson: ""

# One entry per Deployment. `service.name` defaults to the map key; only
# gateway needs the override (Deployment "gateway", Service "api-gateway").
deployments:
  identity-service:
    image: identity-service
    replicas: 2
    port: 5000
    service:
      enabled: true
      port: 5000
    configMapName: identity-config
    # identity-db (a pre-install hook) reads POSTGRES_DB/POSTGRES_USER from
    # this ConfigMap, so it has to be a hook too -- see templates/configmap.yaml.
    configMapHookWeight: "-30"
    configMap:
      POSTGRES_DB: "identity_db"
      POSTGRES_USER: "identity"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5000"
      Email__Smtp__Host: "mailpit"
      Email__Smtp__Port: "1025"
      Email__Smtp__UseStartTls: "false"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__ExchangeName: "gbp.identity"
      Telemetry__OtlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
      Telemetry__LokiEndpoint: "http://loki.observability.svc.cluster.local:3100"
    envFrom:
      - configMapRef: {name: shared-config}
      - configMapRef: {name: identity-config}
      - secretRef: {name: identity-secrets}
    env:
      - name: RabbitMq__Username
        valueFrom: {secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER}}
      - name: RabbitMq__Password
        valueFrom: {secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS}}
    livenessProbe:
      httpGet: {path: /health, port: 5000}
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: {path: /health/ready, port: 5000}
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70

  economy-service:
    image: economy-service
    replicas: 2
    port: 5001
    service:
      enabled: true
      port: 5001
    configMapName: economy-config
    # economy-db (a pre-install hook) reads POSTGRES_DB/POSTGRES_USER from
    # this ConfigMap, so it has to be a hook too -- see templates/configmap.yaml.
    configMapHookWeight: "-30"
    configMap:
      POSTGRES_DB: "economy_db"
      POSTGRES_USER: "economy"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5001"
      Jwt__JwksUri: "http://identity-service:5000/.well-known/jwks.json"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      Telemetry__OtlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
      Telemetry__LokiEndpoint: "http://loki.observability.svc.cluster.local:3100"
    envFrom:
      - configMapRef: {name: shared-config}
      - configMapRef: {name: economy-config}
      - secretRef: {name: economy-secrets}
    env:
      - name: RabbitMq__Username
        valueFrom: {secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER}}
      - name: RabbitMq__Password
        valueFrom: {secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS}}
    # UserEmailConfirmedConsumer binds its queue to gbp.identity at startup
    # and the whole host goes down if that exchange doesn't exist yet; only
    # identity-service's own topology initializer declares it. There's no
    # depends_on in Kubernetes, so this waits for identity-service to report
    # ready instead of letting economy-service crash-loop until it wins the
    # race on its own.
    initContainers:
      - name: wait-for-identity
        image: busybox:1.36
        command: ["sh", "-c", "until wget -qO- http://identity-service:5000/health/ready; do sleep 2; done"]
    livenessProbe:
      httpGet: {path: /health, port: 5001}
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: {path: /health/ready, port: 5001}
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70

  notification-service:
    image: notification-service
    replicas: 1
    port: 5003
    service:
      enabled: true
      port: 5003
    configMapName: notification-config
    configMap:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5003"
      Jwt__JwksUri: "http://identity-service:5000/.well-known/jwks.json"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      Telemetry__OtlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
      Telemetry__LokiEndpoint: "http://loki.observability.svc.cluster.local:3100"
    envFrom:
      - configMapRef: {name: shared-config}
      - configMapRef: {name: notification-config}
    env:
      - name: RabbitMq__Username
        valueFrom: {secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER}}
      - name: RabbitMq__Password
        valueFrom: {secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS}}
    # BalanceChangedConsumer binds its queue to gbp.economy at startup and the
    # whole host goes down if that exchange doesn't exist yet; only
    # economy-service's own topology initializer declares it.
    initContainers:
      - name: wait-for-economy
        image: busybox:1.36
        command: ["sh", "-c", "until wget -qO- http://economy-service:5001/health/ready; do sleep 2; done"]
    livenessProbe:
      httpGet: {path: /health, port: 5003}
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: {path: /health/ready, port: 5003}
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

  platform-worker:
    image: platform-worker
    replicas: 1
    configMapName: platform-worker-config
    configMap:
      Telemetry__OtlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
      Telemetry__LokiEndpoint: "http://loki.observability.svc.cluster.local:3100"
    envFrom:
      - configMapRef: {name: platform-worker-config}
      - secretRef: {name: identity-secrets}
      - secretRef: {name: economy-secrets}
    livenessProbe:
      exec: {command: ["sh", "-c", "grep -q dotnet /proc/1/cmdline"]}
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

  player-client:
    image: player-client
    replicas: 2
    port: 8080
    service:
      enabled: true
      port: 8080
    livenessProbe:
      httpGet: {path: /, port: 8080}
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: {path: /, port: 8080}
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

  admin-client:
    image: admin-client
    replicas: 2
    port: 8081
    service:
      enabled: true
      port: 8081
    livenessProbe:
      httpGet: {path: /, port: 8081}
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: {path: /, port: 8081}
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

  gateway:
    image: api-gateway
    replicas: 2
    port: 5100
    service:
      enabled: true
      name: api-gateway
      port: 5100
    configMapName: gateway-config
    configMap:
      ASPNETCORE_ENVIRONMENT: "Kubernetes"
      ASPNETCORE_URLS: "http://+:5100"
      Jwt__JwksUri: "http://identity-service:5000/.well-known/jwks.json"
      Telemetry__OtlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
      Telemetry__LokiEndpoint: "http://loki.observability.svc.cluster.local:3100"
    envFrom:
      - configMapRef: {name: shared-config}
      - configMapRef: {name: gateway-config}
    volumeMounts:
      - name: ocelot-kubernetes-config
        mountPath: /app/ocelot.Kubernetes.json
        subPath: ocelot.Kubernetes.json
    volumes:
      - name: ocelot-kubernetes-config
        configMap:
          name: gateway-config
          items:
            - key: ocelot.Kubernetes.json
              path: ocelot.Kubernetes.json
    livenessProbe:
      httpGet: {path: /health, port: 5100}
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: {path: /health, port: 5100}
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70

  mailpit:
    image: axllent/mailpit
    internal: false
    replicas: 1
    service:
      enabled: true
      ports:
        - {name: smtp, port: 1025}
        - {name: ui, port: 8025}
    ports:
      - {name: smtp, containerPort: 1025}
      - {name: ui, containerPort: 8025}
    env:
      - name: MP_MAX_MESSAGES
        value: "500"
    readinessProbe:
      exec: {command: ["/mailpit", "readyz"]}
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}

  # otel-collector below sets `namespace: observability` (see the
  # observability values block above) and `internal: false` -- same as
  # mailpit above, it runs its own upstream image straight from Docker Hub,
  # not something built from this repo and pushed to this platform's own
  # registry.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    internal: false
    namespace: observability
    replicas: 1
    args: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - {name: otlp-grpc, containerPort: 4317}
      - {name: otlp-http, containerPort: 4318}
      - {name: metrics, containerPort: 8889}
    service:
      enabled: true
      ports:
        - {name: otlp-grpc, port: 4317, targetPort: 4317}
        - {name: otlp-http, port: 4318, targetPort: 4318}
        - {name: metrics, port: 8889, targetPort: 8889}
    configMapName: otel-collector-config
    volumeMounts:
      - name: config
        mountPath: /etc/otel-collector-config.yaml
        subPath: otel-collector-config.yaml
    volumes:
      - name: config
        configMap:
          name: otel-collector-config
          items:
            - {key: otel-collector-config.yaml, path: otel-collector-config.yaml}
    readinessProbe:
      tcpSocket: {port: 4317}
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

  tempo:
    image: grafana/tempo:2.7.1
    internal: false
    namespace: observability
    replicas: 1
    args: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    env:
      - name: TEMPO_RETENTION_PERIOD
        value: "4380h"
    ports:
      - {name: otlp-grpc, containerPort: 4317}
      - {name: otlp-http, containerPort: 4318}
      - {name: http, containerPort: 3200}
    service:
      enabled: true
      ports:
        - {name: otlp-grpc, port: 4317, targetPort: 4317}
        - {name: otlp-http, port: 4318, targetPort: 4318}
        - {name: http, port: 3200, targetPort: 3200}
    configMapName: tempo-config
    volumeMounts:
      - name: config
        mountPath: /etc/tempo.yaml
        subPath: tempo-config.yaml
      - name: data
        mountPath: /var/tempo
    volumes:
      - name: config
        configMap:
          name: tempo-config
          items:
            - {key: tempo-config.yaml, path: tempo-config.yaml}
      - name: data
        persistentVolumeClaim: {claimName: tempo-data}
    readinessProbe:
      httpGet: {path: /ready, port: 3200}
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}

  prometheus:
    image: prom/prometheus:v3.9.1
    internal: false
    namespace: observability
    replicas: 1
    # Runs as the image's own non-root user (uid 65534) -- fsGroup makes the
    # local-path-provisioner PVC actually writable by it, unlike the
    # postgres image elsewhere in this chart, whose entrypoint chowns its
    # own data directory itself before dropping privileges.
    securityContext:
      fsGroup: 65534
    args:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=180d"
    ports:
      - {name: http, containerPort: 9090}
    service:
      enabled: true
      port: 9090
    configMapName: prometheus-config
    volumeMounts:
      - name: config
        mountPath: /etc/prometheus/prometheus.yml
        subPath: prometheus.yml
      - name: data
        mountPath: /prometheus
    volumes:
      - name: config
        configMap:
          name: prometheus-config
          items:
            - {key: prometheus.yml, path: prometheus.yml}
      - name: data
        persistentVolumeClaim: {claimName: prometheus-data}
    readinessProbe:
      httpGet: {path: /-/healthy, port: 9090}
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}

  loki:
    image: grafana/loki:3.3.2
    internal: false
    namespace: observability
    replicas: 1
    args: ["-config.file=/etc/loki/loki-config.yaml", "-config.expand-env=true"]
    env:
      - name: LOKI_RETENTION_PERIOD
        value: "4380h"
    ports:
      - {name: http, containerPort: 3100}
    service:
      enabled: true
      port: 3100
    configMapName: loki-config
    volumeMounts:
      - name: config
        mountPath: /etc/loki/loki-config.yaml
        subPath: loki-config.yaml
      - name: data
        mountPath: /loki
    volumes:
      - name: config
        configMap:
          name: loki-config
          items:
            - {key: loki-config.yaml, path: loki-config.yaml}
      - name: data
        persistentVolumeClaim: {claimName: loki-data}
    readinessProbe:
      httpGet: {path: /ready, port: 3100}
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

  grafana:
    image: grafana/grafana:12.0.0
    internal: false
    namespace: observability
    replicas: 1
    # Runs as the image's own non-root user (uid 472); same PVC-writability
    # reasoning as prometheus above.
    securityContext:
      fsGroup: 472
    ports:
      - {name: http, containerPort: 3000}
    service:
      enabled: true
      port: 3000
    envFrom:
      - secretRef: {name: grafana-secrets}
    configMapName: grafana-config
    volumeMounts:
      - name: config
        mountPath: /etc/grafana/provisioning/datasources/datasources.yml
        subPath: datasources.yml
      - name: config
        mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
        subPath: dashboards.yml
      - name: config
        mountPath: /etc/grafana/dashboards/service-overview.json
        subPath: service-overview.json
      - name: data
        mountPath: /var/lib/grafana
    volumes:
      - name: config
        configMap:
          name: grafana-config
          items:
            - {key: datasources.yml, path: datasources.yml}
            - {key: dashboards.yml, path: dashboards.yml}
            - {key: service-overview.json, path: service-overview.json}
      - name: data
        persistentVolumeClaim: {claimName: grafana-data}
    readinessProbe:
      httpGet: {path: /api/health, port: 3000}
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

# Standalone PVCs (see templates/pvc.yaml) for observability Deployments that
# own persistent state but are single-replica, same as their docker-compose
# counterparts -- a plain PVC rather than a StatefulSet's
# volumeClaimTemplate. otel-collector is stateless and has no entry here,
# matching its docker-compose counterpart.
persistentVolumeClaims:
  tempo-data:
    namespace: observability
    storage: 1Gi
  prometheus-data:
    namespace: observability
    storage: 1Gi
  loki-data:
    namespace: observability
    storage: 1Gi
  grafana-data:
    namespace: observability
    storage: 1Gi

# One entry per StatefulSet. identity-db/economy-db also carry `hook.weight`:
# see templates/statefulset.yaml for why they need to be pre-install/
# pre-upgrade hooks too, not just the migration Jobs.
statefulsets:
  identity-db:
    image: postgres:17-alpine
    containerName: postgres
    port: 5432
    env:
      - name: POSTGRES_DB
        valueFrom: {configMapKeyRef: {name: identity-config, key: POSTGRES_DB}}
      - name: POSTGRES_USER
        valueFrom: {configMapKeyRef: {name: identity-config, key: POSTGRES_USER}}
      - name: POSTGRES_PASSWORD
        valueFrom: {secretKeyRef: {name: identity-secrets, key: POSTGRES_PASSWORD}}
    volumeMount: {name: identity-db-data, mountPath: /var/lib/postgresql/data, subPath: postgres}
    storage: 1Gi
    readinessProbe:
      exec: {command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]}
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    hook:
      weight: "-20"

  economy-db:
    image: postgres:17-alpine
    containerName: postgres
    port: 5432
    env:
      - name: POSTGRES_DB
        valueFrom: {configMapKeyRef: {name: economy-config, key: POSTGRES_DB}}
      - name: POSTGRES_USER
        valueFrom: {configMapKeyRef: {name: economy-config, key: POSTGRES_USER}}
      - name: POSTGRES_PASSWORD
        valueFrom: {secretKeyRef: {name: economy-secrets, key: POSTGRES_PASSWORD}}
    volumeMount: {name: economy-db-data, mountPath: /var/lib/postgresql/data, subPath: postgres}
    storage: 1Gi
    readinessProbe:
      exec: {command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]}
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    hook:
      weight: "-20"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    containerPorts:
      - {name: amqp, containerPort: 5672}
      - {name: management, containerPort: 15672}
    svcPorts:
      - {name: amqp, port: 5672, targetPort: 5672}
      - {name: management, port: 15672, targetPort: 15672}
    env:
      - name: RABBITMQ_DEFAULT_USER
        valueFrom: {secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER}}
      - name: RABBITMQ_DEFAULT_PASS
        valueFrom: {secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS}}
    volumeMount: {name: rabbitmq-data, mountPath: /var/lib/rabbitmq}
    storage: 1Gi
    readinessProbe:
      exec: {command: ["rabbitmq-diagnostics", "check_port_connectivity"]}
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 10
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}

# Migration Jobs, run as pre-install/pre-upgrade hooks (see
# templates/migration-job.yaml) at a later weight than their StatefulSet, so
# the DB StatefulSet's object exists first. Each Job still polls its own DB
# with pg_isready before running the migrator -- Helm applies a hook
# StatefulSet without waiting for it to become Ready, only Job hooks are
# actually waited on.
migrationJobs:
  identity-migrator:
    image: identity-migrator
    dbHost: identity-db
    secretName: identity-secrets
    connectionStringKey: ConnectionStrings__IdentityDb
    hookWeight: "-10"
  economy-migrator:
    image: economy-migrator
    dbHost: economy-db
    secretName: economy-secrets
    connectionStringKey: ConnectionStrings__EconomyDb
    hookWeight: "-10"
