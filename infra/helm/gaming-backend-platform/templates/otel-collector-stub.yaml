# player-client's and admin-client's own nginx.conf hardcode
# `proxy_pass http://otel-collector:4318/` for their /otlp/ Faro proxy
# (frontend/projects/{player-client,admin-client}/nginx.conf), and nginx
# resolves that hostname via DNS at config-load time -- not lazily, not only
# when a request actually hits /otlp/. No otel-collector exists in Kubernetes
# at all yet (observability is still docker-compose-only, ADR-0019), so
# without something answering to that name both Deployments crash-loop
# before ever serving a page, in every environment, not just this one.
# This Service exists purely to give the hostname a DNS answer; it has no
# selector, so it backs no real endpoints and traffic sent to it will just
# fail at connect time -- the same silent no-op tracing already has when the
# collector is simply down. Delete this the same session a real
# otel-collector Service lands in this chart.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gbp.labels" . | nindent 4 }}
spec:
  ports:
    - port: 4318
      targetPort: 4318
