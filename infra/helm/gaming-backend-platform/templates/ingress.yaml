{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gbp.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.playerClient.service }}
                port:
                  number: {{ .Values.ingress.playerClient.port }}
    # Host-based rule -- admin-client needs a genuinely separate origin, not
    # just another path prefix under the same host. On a local kind cluster
    # this hostname resolves only via an /etc/hosts entry pointed at the
    # ingress controller's address; a real cluster would resolve it through
    # actual DNS instead.
    - host: {{ .Values.ingress.adminHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.adminClient.service }}
                port:
                  number: {{ .Values.ingress.adminClient.port }}
{{- end }}
