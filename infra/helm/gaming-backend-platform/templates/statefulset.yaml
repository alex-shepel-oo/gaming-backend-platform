{{- range $name, $svc := .Values.statefulsets }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gbp.labels" $ | nindent 4 }}
    app: {{ $name }}
  {{- if $svc.hook }}
  annotations:
    # Migration Jobs (templates/migration-job.yaml) run as pre-install/
    # pre-upgrade hooks so they finish before any app Deployment starts --
    # which means this StatefulSet has to be a hook too, at an earlier
    # weight, or it wouldn't exist yet when the hook phase runs (pre-install
    # hooks execute strictly before every non-hook resource in the release).
    # Helm doesn't wait for a StatefulSet hook to become Ready the way it
    # waits for a Job hook to complete, so the migration Job's own
    # initContainer still polls pg_isready itself -- this only guarantees
    # the object was submitted first. The real cost: the default
    # before-hook-creation delete policy recreates this StatefulSet (and its
    # pod) on every `helm upgrade`, not just the first install. Acceptable
    # here since these Postgres instances are explicitly dev/sandbox-only
    # (see docs/architecture.md); a managed production database would never
    # go through this path.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ $svc.hook.weight | quote }}
  {{- end }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $svc.containerName | default $name }}
          image: {{ $svc.image }}
          {{- if $svc.port }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          {{- if $svc.containerPorts }}
          ports:
            {{- $svc.containerPorts | toYaml | nindent 12 }}
          {{- end }}
          env:
            {{- $svc.env | toYaml | nindent 12 }}
          volumeMounts:
            - name: {{ $svc.volumeMount.name }}
              mountPath: {{ $svc.volumeMount.mountPath }}
              {{- if $svc.volumeMount.subPath }}
              subPath: {{ $svc.volumeMount.subPath }}
              {{- end }}
          readinessProbe:
            {{- $svc.readinessProbe | toYaml | nindent 12 }}
          resources:
            {{- $svc.resources | toYaml | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: {{ $svc.volumeMount.name }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $svc.storage }}
{{- end }}
