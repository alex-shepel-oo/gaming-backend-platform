# Named "mailpit" to match Email__Smtp__Host in identity/configmap.yaml.
# No Ingress: reach the UI with
#   kubectl -n gaming-platform port-forward svc/mailpit 8025:8025
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: gaming-platform
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
