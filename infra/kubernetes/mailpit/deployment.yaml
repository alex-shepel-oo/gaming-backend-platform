# Apply only to local kind clusters and the sandbox namespace. Never apply
# this to the production namespace: Email__Smtp__Host there points at the
# real relay, and a catcher sitting in front of it would silently swallow
# every email the platform sends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: gaming-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit
          env:
            - name: MP_MAX_MESSAGES
              value: "500"
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          readinessProbe:
            exec:
              command: ["/mailpit", "readyz"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
