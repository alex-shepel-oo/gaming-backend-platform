# Assumes ingress-nginx as the ingress controller, the standard addon for
# kind clusters; a managed cluster's ingress class may need a different
# ingressClassName here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: gaming-platform
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: player-client
                port:
                  number: 8080
