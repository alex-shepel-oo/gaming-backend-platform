apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: gaming-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/alex-shepel-oo/api-gateway:latest
          ports:
            - containerPort: 5100
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: gateway-config
          env:
            # Same signing key identity-service uses, read from its Secret
            # rather than duplicated into one of the gateway's own: HS256
            # validation only works if both sides agree on the key, and one
            # Secret as the source of truth rules out the two drifting apart.
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: identity-secrets
                  key: Jwt__Key
          volumeMounts:
            - name: ocelot-kubernetes-config
              mountPath: /app/ocelot.Kubernetes.json
              subPath: ocelot.Kubernetes.json
          livenessProbe:
            httpGet:
              path: /health
              port: 5100
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5100
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: ocelot-kubernetes-config
          configMap:
            name: gateway-config
            items:
              - key: ocelot.Kubernetes.json
                path: ocelot.Kubernetes.json
