# ocelot.Kubernetes.json is mounted over the copy already baked into the
# image (see ApiGateway/Dockerfile), so routing changes ship as a ConfigMap
# update instead of an image rebuild. Content matches
# backend/ApiGateway/ocelot.Kubernetes.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: gaming-platform
data:
  ASPNETCORE_ENVIRONMENT: "Kubernetes"
  ASPNETCORE_URLS: "http://+:5100"
  ocelot.Kubernetes.json: |
    {
      "Routes": [
        {
          "DownstreamHostAndPorts": [
            { "Host": "identity-service.gaming-platform.svc.cluster.local", "Port": 5000 }
          ]
        },
        {
          "DownstreamHostAndPorts": [
            { "Host": "identity-service.gaming-platform.svc.cluster.local", "Port": 5000 }
          ]
        },
        {
          "DownstreamHostAndPorts": [
            { "Host": "identity-service.gaming-platform.svc.cluster.local", "Port": 5000 }
          ]
        },
        {
          "DownstreamHostAndPorts": [
            { "Host": "identity-service.gaming-platform.svc.cluster.local", "Port": 5000 }
          ]
        }
      ]
    }
