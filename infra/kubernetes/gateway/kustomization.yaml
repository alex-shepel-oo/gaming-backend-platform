# gateway-config is generated straight from backend/ApiGateway/ocelot.Kubernetes.json
# instead of a hand-copied inline block: there is no second copy of the routing
# table to fall out of sync, and the generated ConfigMap's name-suffix hash
# changes whenever the file changes, so `kubectl apply -k` also rolls the
# gateway Deployment automatically (Kustomize rewrites the configMapRef/
# volumes.configMap references below to the hashed name for every resource
# listed here).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

configMapGenerator:
  - name: gateway-config
    namespace: gaming-platform
    literals:
      - ASPNETCORE_ENVIRONMENT=Kubernetes
      - ASPNETCORE_URLS=http://+:5100
      - Jwt__JwksUri=http://identity-service:5000/.well-known/jwks.json
    files:
      - ocelot.Kubernetes.json=../../../backend/ApiGateway/ocelot.Kubernetes.json
