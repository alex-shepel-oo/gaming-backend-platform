# Composes the whole namespace from the per-service manifests. Secrets are
# deliberately not listed here -- each service's secret.example.yaml is a
# template (see the comment in each file); copy, fill in real values, and
# apply that copy separately before this. gateway/ carries its own
# kustomization.yaml (configMapGenerator for gateway-config), referenced
# here as a directory so its ConfigMap keeps the hash-suffixed name and the
# automatic Deployment rollout that comes with it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base/00-namespace.yaml
  - base/01-configmap.yaml
  - identity/configmap.yaml
  - identity/db-statefulset.yaml
  - identity/db-service.yaml
  - identity/deployment.yaml
  - identity/service.yaml
  - identity/hpa.yaml
  - economy/configmap.yaml
  - economy/db-statefulset.yaml
  - economy/db-service.yaml
  - economy/deployment.yaml
  - economy/service.yaml
  - economy/hpa.yaml
  - rabbitmq/statefulset.yaml
  - rabbitmq/service.yaml
  - mailpit/deployment.yaml
  - mailpit/service.yaml
  - gateway
