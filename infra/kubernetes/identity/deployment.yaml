apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: gaming-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: ghcr.io/alex-shepel-oo/identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: identity-config
            - secretRef:
                name: identity-secrets
          env:
            # Reuses the broker's own credentials Secret rather than copying
            # the values into identity-secrets -- one Secret, every consumer
            # of the broker (this Deployment, economy-service, platform-worker
            # later) reads it.
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            # Checks Postgres (see AddIdentityHealthChecks). A pod that can't
            # reach the database should drop out of the Service's endpoints,
            # not get killed and restarted into the same failure.
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
