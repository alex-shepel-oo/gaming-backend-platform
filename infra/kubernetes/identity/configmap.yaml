apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-config
  namespace: gaming-platform
data:
  POSTGRES_DB: "identity_db"
  POSTGRES_USER: "identity"
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:5000"
  # Mailpit host: valid for local kind clusters and the sandbox namespace
  # only (see the mailpit manifests). Production supplies its own value
  # here, pointing at the real SMTP relay.
  Email__Smtp__Host: "mailpit"
  Email__Smtp__Port: "1025"
  Email__Smtp__UseStartTls: "false"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Port: "5672"
  RabbitMq__ExchangeName: "gbp.identity"
