# POSTGRES_DB / POSTGRES_USER come from the economy-config ConfigMap and
# POSTGRES_PASSWORD from the economy-secrets Secret, both added alongside
# the economy-service Deployment in a later commit. The values here must
# stay in sync with ConnectionStrings__EconomyDb in that Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: economy-db
  namespace: gaming-platform
spec:
  serviceName: economy-db
  replicas: 1
  selector:
    matchLabels:
      app: economy-db
  template:
    metadata:
      labels:
        app: economy-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: economy-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: economy-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: economy-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            # subPath keeps the volume root free of postgres's own data
            # directory contents (lost+found on some storage classes trips
            # postgres's "data directory is not empty" startup check).
            - name: economy-db-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: economy-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
