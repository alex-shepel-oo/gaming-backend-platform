# Headless (clusterIP: None) so the StatefulSet's pod gets a stable DNS
# identity (economy-db-0.economy-db.gaming-platform.svc.cluster.local)
# instead of a load-balanced one -- there is exactly one writer to talk to.
apiVersion: v1
kind: Service
metadata:
  name: economy-db
  namespace: gaming-platform
spec:
  clusterIP: None
  selector:
    app: economy-db
  ports:
    - port: 5432
      targetPort: 5432
