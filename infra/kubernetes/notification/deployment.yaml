apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: gaming-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        # BalanceChangedConsumer binds its queue to gbp.economy at startup and
        # the whole host goes down if that exchange doesn't exist yet; only
        # EconomyService's own topology initializer declares it. There is no
        # depends_on in Kubernetes, so this waits for economy-service to report
        # ready (meaning it has run at least once) before the main container
        # starts, instead of letting notification-service crash-loop until it
        # wins the race on its own.
        - name: wait-for-economy
          image: busybox:1.36
          command: ["sh", "-c", "until wget -qO- http://economy-service:5001/health/ready; do sleep 2; done"]
      containers:
        - name: notification-service
          image: ghcr.io/alex-shepel-oo/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: notification-config
          env:
            # Same signing key identity-service issues (ADR-0008): notification-service
            # validates the same HS256 tokens, so it reads from the one Secret
            # rather than holding its own copy that could drift on rotation.
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: identity-secrets
                  key: Jwt__Key
            # Reuses the broker's own credentials Secret rather than copying
            # the values into a notification-only Secret.
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
