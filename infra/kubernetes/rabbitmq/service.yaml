# Headless (clusterIP: None), same reasoning as identity-db/economy-db: a
# single-instance backing service gets a stable pod DNS identity rather than
# a load-balanced one. Management UI (15672) stays on the same Service for
# kubectl port-forward during local demos, same as its compose mapping.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: gaming-platform
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
