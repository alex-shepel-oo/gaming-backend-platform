apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-client
  namespace: gaming-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: player-client
  template:
    metadata:
      labels:
        app: player-client
    spec:
      containers:
        - name: player-client
          image: ghcr.io/alex-shepel-oo/player-client:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
