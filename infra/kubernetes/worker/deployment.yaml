apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
  namespace: gaming-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-worker
  template:
    metadata:
      labels:
        app: platform-worker
    spec:
      containers:
        - name: platform-worker
          image: ghcr.io/alex-shepel-oo/platform-worker:latest
          envFrom:
            - secretRef:
                name: identity-secrets
            - secretRef:
                name: economy-secrets
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -q dotnet /proc/1/cmdline"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
