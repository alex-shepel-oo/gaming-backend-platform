services:
  identity_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required, set it in infra/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required, set it in infra/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, set it in infra/.env}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required, set it in infra/.env} -d ${POSTGRES_DB:?POSTGRES_DB is required, set it in infra/.env}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  economy_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${ECONOMY_POSTGRES_DB:?ECONOMY_POSTGRES_DB is required, set it in infra/.env}"
      POSTGRES_USER: "${ECONOMY_POSTGRES_USER:?ECONOMY_POSTGRES_USER is required, set it in infra/.env}"
      POSTGRES_PASSWORD: "${ECONOMY_POSTGRES_PASSWORD:?ECONOMY_POSTGRES_PASSWORD is required, set it in infra/.env}"
    ports:
      - "${ECONOMY_POSTGRES_PORT:-5434}:5432"
    volumes:
      - economy_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ECONOMY_POSTGRES_USER:?ECONOMY_POSTGRES_USER is required, set it in infra/.env} -d ${ECONOMY_POSTGRES_DB:?ECONOMY_POSTGRES_DB is required, set it in infra/.env}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0 -config-dir=/consul/config
    ports:
      - "${CONSUL_HTTP_PORT:-8500}:8500"
    volumes:
      - ./consul/config:/consul/config
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  identity-migrator:
    build:
      context: ../backend
      dockerfile: IdentityService/Dockerfile
      target: migrator
    env_file:
      - .env
    environment:
      ConnectionStrings__IdentityDb: "Host=identity_db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required, set it in infra/.env};Username=${POSTGRES_USER:?POSTGRES_USER is required, set it in infra/.env};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, set it in infra/.env}"
    depends_on:
      identity_db:
        condition: service_healthy
    networks:
      - platform-network

  identity-service:
    build:
      context: ../backend
      dockerfile: IdentityService/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__IdentityDb: "Host=identity_db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required, set it in infra/.env};Username=${POSTGRES_USER:?POSTGRES_USER is required, set it in infra/.env};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, set it in infra/.env}"
    ports:
      - "${IDENTITY_SERVICE_PORT:-5000}:5000"
    depends_on:
      identity_db:
        condition: service_healthy
      identity-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?RABBITMQ_USER is required, set it in infra/.env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required, set it in infra/.env}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  economy-migrator:
    build:
      context: ../backend
      dockerfile: EconomyService/Dockerfile
      target: migrator
    env_file:
      - .env
    environment:
      ConnectionStrings__EconomyDb: "Host=economy_db;Port=5432;Database=${ECONOMY_POSTGRES_DB:?ECONOMY_POSTGRES_DB is required, set it in infra/.env};Username=${ECONOMY_POSTGRES_USER:?ECONOMY_POSTGRES_USER is required, set it in infra/.env};Password=${ECONOMY_POSTGRES_PASSWORD:?ECONOMY_POSTGRES_PASSWORD is required, set it in infra/.env}"
    depends_on:
      economy_db:
        condition: service_healthy
    networks:
      - platform-network

  economy-service:
    build:
      context: ../backend
      dockerfile: EconomyService/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5001"
      ConnectionStrings__EconomyDb: "Host=economy_db;Port=5432;Database=${ECONOMY_POSTGRES_DB:?ECONOMY_POSTGRES_DB is required, set it in infra/.env};Username=${ECONOMY_POSTGRES_USER:?ECONOMY_POSTGRES_USER is required, set it in infra/.env};Password=${ECONOMY_POSTGRES_PASSWORD:?ECONOMY_POSTGRES_PASSWORD is required, set it in infra/.env}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: "${RABBITMQ_USER:?RABBITMQ_USER is required, set it in infra/.env}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required, set it in infra/.env}"
    ports:
      - "${ECONOMY_SERVICE_PORT:-5001}:5001"
    depends_on:
      economy_db:
        condition: service_healthy
      economy-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  notification-service:
    build:
      context: ../backend
      dockerfile: NotificationService/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5003"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: "${RABBITMQ_USER:?RABBITMQ_USER is required, set it in infra/.env}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required, set it in infra/.env}"
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-5003}:5003"
    depends_on:
      rabbitmq:
        condition: service_healthy
      # BalanceChangedConsumer binds its queue to gbp.economy at startup and
      # the whole host goes down if that exchange doesn't exist yet; only
      # EconomyService's own topology initializer declares it. This ordering
      # is a docker-compose-only stopgap, not something the eventual k8s
      # manifests inherit automatically.
      economy-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5003/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  platform-worker:
    build:
      context: ../backend
      dockerfile: Platform.Worker/Dockerfile
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: "Host=identity_db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required, set it in infra/.env};Username=${POSTGRES_USER:?POSTGRES_USER is required, set it in infra/.env};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, set it in infra/.env}"
      ConnectionStrings__EconomyDb: "Host=economy_db;Port=5432;Database=${ECONOMY_POSTGRES_DB:?ECONOMY_POSTGRES_DB is required, set it in infra/.env};Username=${ECONOMY_POSTGRES_USER:?ECONOMY_POSTGRES_USER is required, set it in infra/.env};Password=${ECONOMY_POSTGRES_PASSWORD:?ECONOMY_POSTGRES_PASSWORD is required, set it in infra/.env}"
      CleanupJob__IntervalMinutes: "${CLEANUP_JOB_INTERVAL_MINUTES:-15}"
      CleanupJob__OutboxRetentionDays: "${CLEANUP_JOB_OUTBOX_RETENTION_DAYS:-7}"
    depends_on:
      identity_db:
        condition: service_healthy
      economy_db:
        condition: service_healthy
    networks:
      - platform-network

  api-gateway:
    build:
      context: ../backend
      dockerfile: ApiGateway/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5100"
    ports:
      - "${API_GATEWAY_PORT:-5100}:5100"
    depends_on:
      consul:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5100/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  player-client:
    build:
      context: ../frontend
      dockerfile: projects/player-client/Dockerfile
    ports:
      - "${PLAYER_CLIENT_PORT:-8080}:8080"
    depends_on:
      - api-gateway
    networks:
      - platform-network

  mailpit:
    image: axllent/mailpit
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge

volumes:
  identity_db_data:
  economy_db_data:
