services:
  identity_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required, set it in infra/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required, set it in infra/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, set it in infra/.env}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required, set it in infra/.env} -d ${POSTGRES_DB:?POSTGRES_DB is required, set it in infra/.env}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0
    ports:
      - "${CONSUL_HTTP_PORT:-8500}:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  mailpit:
    image: axllent/mailpit
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge

volumes:
  identity_db_data:
