# Scrapes the otel-collector's own Prometheus exporter (see
# infra/otel-collector/otel-collector-config.yaml), not each service directly - every service
# pushes OTLP metrics to the collector, and the collector is the one thing this scrapes.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Without this, Prometheus's own job/instance (both "otel-collector", the only
    # scrape target) wins on collision and the real per-service job/instance -- the
    # thing this dashboard actually groups by -- gets renamed to exported_job/
    # exported_instance instead. honor_labels keeps the scraped values authoritative.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
